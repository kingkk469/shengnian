[project]
name = "voice-journal"
version = "0.3.0"
description = "声年：本地优先的 AI 语音知识库"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "funasr>=1.0.0",
    "gmssl>=3.2.2",
    "lxml-html-clean>=0.4.5",
    "modelscope>=1.13.0",
    "openai>=1.30.0",
    "pyside6>=6.6.0",
    "pyyaml>=6.0",
    "requests>=2.33.0",
    "rookiepy>=0.5.0",
    "sounddevice>=0.4.6",
    "torch>=2.0.0",
    "trafilatura>=2.0.0",
    "watchdog>=3.0.0",
    "webrtcvad-wheels>=2.0.14",
    "yt-dlp>=2024.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "dist", "release"]
