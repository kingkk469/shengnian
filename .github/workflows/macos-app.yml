name: Build macOS standalone app
on:
  push:
    branches: ["codex/macos-app-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Restore public model and decoder resources
        id: bundle-resources
        uses: actions/cache/restore@v4
        with:
          path: assets-heavy/macos-bundle
          key: macos-arm64-resources-v1-${{ hashFiles('macos/build_ffmpeg.py', 'macos/prepare_bundle.py', 'macos/requirements-resolved.txt') }}
      - name: Install Python runtime dependencies
        run: bash macos/build.sh dependencies
      - name: Run regression tests on Mac
        run: bash macos/build.sh test
      - name: Compile bundled audio decoder
        if: steps.bundle-resources.outputs.cache-hit != 'true'
        run: bash macos/build.sh decoder
      - name: Prepare local speech models
        if: steps.bundle-resources.outputs.cache-hit != 'true'
        run: bash macos/build.sh resources
      - name: Cache verified public resources
        if: steps.bundle-resources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: assets-heavy/macos-bundle
          key: ${{ steps.bundle-resources.outputs.cache-primary-key }}
      - name: Build standalone application
        run: bash macos/build.sh package
      - name: Verify packaged app and model inference
        run: bash macos/build.sh verify
      - name: Create and verify DMG
        run: bash macos/build.sh dmg
      - name: Upload standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: shengnian-macos-arm64
          path: release/shengnian-macos-arm64.dmg*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-evidence
          path: |
            .test-data/frozen-mac/runtime/mac-self-test-*.json
            .test-data/frozen-mac/runtime/mac-app.png
            .test-data/frozen-mac/logs/*.log
            build/shengnian/warn-*.txt
          include-hidden-files: true
          retention-days: 14
